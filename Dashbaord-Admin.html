<!DOCTYPE html>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    
    <!-- PROTEKSI TOTAL + ENKRIPSI -->
    <script>
        // CEK VIEW-SOURCE
        (function() {
            // Jika view-source terdeteksi, redirect ke halaman kosong
            if (window.location.protocol === 'view-source:' || 
                window.location.href.indexOf('view-source:') === 0) {
                window.location.replace('about:blank');
                return;
            }
            
            // Hapus semua konten sementara
            document.documentElement.innerHTML = '';
            
            // Deklarasi variabel global
            window.__protected = true;
            
            // Blokir semua akses shortcut
            document.addEventListener('keydown', function(e) {
                const key = e.key;
                if (key === 'F12' || key === 'F11' || (e.ctrlKey && key === 'u') ||
                    (e.ctrlKey && e.shiftKey && (key === 'I' || key === 'J' || key === 'C'))) {
                    e.preventDefault();
                    window.location.replace('about:blank');
                    return false;
                }
            });
            
            // Blokir right click
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                return false;
            });
            
            // Matikan console
            console.log = console.error = console.warn = function() {};
        })();
    </script>
