<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    
    <script>
        // ========== PROTEKSI VIEW-SOURCE DENGAN ENKRIPSI ==========
        
        // Cek view-source
        if (window.location.protocol === 'view-source:' || 
            window.location.href.indexOf('view-source:') === 0) {
            
            // Generate kode acak 10.000 karakter
            let randomCode = '';
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for(let i = 0; i < 10000; i++) {
                randomCode += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            
            document.documentElement.innerHTML = '<html><head><title>Access Denied</title></head><body><pre style="padding:20px;font-size:12px;">' + randomCode + '</pre></body></html>';
            throw new Error("Access Denied");
        }
        
        // Konten asli dashboard (dalam bentuk terenkripsi)
        const encryptedDashboard = atob(`PGRpdiBzdHlsZT0icGFkZGluZzoyMHB4O2ZvbnQtZmFtaWx5OkFyaWFsIj4KICAgIDxoMT5BZG1pbiBEYXNoYm9hcmQ8L2gxPgogICAgPHA+U2VsYW1hdCBkYXRhbmcgZGUgUGFuZWwgQWRtaW48L3A+CiAgICA8ZGl2IHN0eWxlPSJiYWNrZ3JvdW5kOiNmZmY7cGFkZGluZzoyMHB4O2JvcmRlci1yYWRpdXM6MTBweDtib3gtc2hhZG93OjAgMnB4IDVweCByZ2JhKDAsMCwwLDAuMSkiPgogICAgICAgIDxoMj5EYXRhIFBlbnRpbmdhPC9oMj4KICAgICAgICA8cD5KdW1sYWggdG90YWwgcGVuamHVhbGFuOiA8c3Ryb25nPjEwMCBhdW5nb2E8L3N0cm9uZz48L3A+CiAgICAgICAgPHA+U2lzYSB5YW5nIGJlbHVtIGJlcmphbGFuLjwvcD4KICAgIDwvZGl2Pgo8L2Rpdj4=`);
        
        // Bersihkan dan tampilkan konten asli
        document.documentElement.innerHTML = '';
        
        // Blokir semua shortcut
        document.addEventListener('keydown', function(e) {
            const key = e.key;
            if (key === 'F12' || key === 'F11' || (e.ctrlKey && key === 'u') ||
                (e.ctrlKey && e.shiftKey && (key === 'I' || key === 'J' || key === 'C'))) {
                e.preventDefault();
                // Tampilkan kode acak
                let randomCode = '';
                for(let i = 0; i < 5000; i++) {
                    randomCode += Math.random().toString(36).charAt(2);
                }
                document.body.innerHTML = '<pre>' + randomCode + '</pre>';
                return false;
            }
        });
        
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // Tampilkan dashboard setelah proteksi
        setTimeout(() => {
            document.body.innerHTML = encryptedDashboard;
            
            // Tambahkan style
            const style = document.createElement('style');
            style.textContent = `
                body {
                    margin: 0;
                    padding: 20px;
                    font-family: Arial, sans-serif;
                    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                    min-height: 100vh;
                }
                * {
                    user-select: none;
                }
            `;
            document.head.appendChild(style);
        }, 50);
    </script>
</head>
<body></body>
</html>
