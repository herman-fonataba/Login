<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <script>
        // BLOCK VIEW-SOURCE - Bekerja di HP dan Laptop
        (function() {
            // Deteksi view-source
            if (window.location.protocol === 'view-source:' || 
                window.location.href.startsWith('view-source:') ||
                document.documentURI.startsWith('view-source:')) {
                window.location.replace('about:blank');
                throw new Error('Akses ditolak');
            }
            
            // Blokir semua shortcut
            document.addEventListener('keydown', function(e) {
                const blocked = ['F12', 'F11', 'F10', 'F9', 'F8', 'F7', 'F6', 'F5'];
                if (blocked.includes(e.key)) {
                    e.preventDefault();
                    return false;
                }
                
                if ((e.ctrlKey || e.metaKey) && 
                    (e.key === 'u' || e.key === 'U' || e.key === 'i' || e.key === 'I' ||
                     e.key === 'j' || e.key === 'J' || e.key === 'c' || e.key === 'C' ||
                     e.key === 's' || e.key === 'S' || e.shiftKey)) {
                    e.preventDefault();
                    return false;
                }
            });
            
            // Blokir right click
            document.oncontextmenu = function(e) {
                e.preventDefault();
                return false;
            };
            
            // Matikan console
            console.log = console.error = console.warn = function(){};
        })();
    </script>
    
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>
    <!-- KONTEN ADMIN ANDA DI SINI -->
    <h1>Admin Dashboard</h1>
    <p>Halaman ini tidak bisa dilihat source codenya di HP maupun laptop</p>
</body>
</html>
