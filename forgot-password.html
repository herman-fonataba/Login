<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <meta name="google" content="notranslate">
  <title>Lupa Password - PHOENIX TAEKWONDO FAMILY</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="https://phoenix-taekwondo-family.vercel.app/Foto/PHOENIX%20TAEKWONDO%20FAMILY.svg">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- CSS Utama (sama dengan halaman login) -->
  <link rel="stylesheet" href="https://phoenix-taekwondo-family.vercel.app/CSS/style.css">
</head>
<body>

  <!-- SCREENSHOT OVERLAY -->
  <div id="screenshotOverlay" class="screenshot-overlay">
    <i class="fas fa-ban"></i>
    <h1>⚠️ TERDETEKSI SCREENSHOT ⚠️</h1>
    <p>Maaf, tangkapan layar tidak diizinkan pada halaman ini.</p>
  </div>

  <!-- NOTIFICATION -->
  <div id="notification" class="notification">
    <i class="fas fa-info-circle"></i>
    <span id="notificationMessage"></span>
  </div>

  <!-- IPHONE BLOCKER -->
  <div class="iphone-blocker" id="iphoneBlocker">
    <div class="blocker-content">
      <i class="fas fa-ban"></i>
      <i class="fas fa-fire"></i>
      <h1>PHOENIX<br>MENOLAK IPHONE</h1>
      <p>Gunakan Android, Windows, atau Mac.</p>
    </div>
  </div>

  <!-- CANVAS BACKGROUND -->
  <canvas id="phoenixCanvas"></canvas>
  <div class="dark-overlay"></div>
  <div id="emberContainer"></div>
  <div class="feather-glow" style="left: -30px; bottom: 0;"></div>
  <div class="feather-glow" style="right: -30px; bottom: 0;"></div>

  <!-- HALAMAN LUPA PASSWORD -->
  <div id="forgotPasswordPage" class="phoenix-wrapper visible-page">
    <div class="phoenix-header">
      <div class="welcome-image-container">
        <img class="welcome-image" src="https://phoenix-taekwondo-family.vercel.app/Foto/SELAMAT%20DATANG.svg" alt="Selamat Datang">
      </div>
      <div class="logo-container">
        <div class="circle-logo-wrapper">
          <div class="circle-logo">
            <img src="https://phoenix-taekwondo-family.vercel.app/Foto/PHOENIX%20TAEKWONDO%20FAMILY.svg" alt="Logo">
          </div>
        </div>
      </div>
      <div class="page-title">
        <i class="fas fa-fire"></i> LUPA PASSWORD <i class="fas fa-fire"></i>
      </div>
    </div>

    <form id="forgotPasswordForm">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="resetEmail" placeholder="Masukkan EMAIL" required>
      </div>
      <div class="input-group">
        <i class="fab fa-whatsapp"></i>
        <input type="tel" id="resetPhone" placeholder="Masukkan Nomor WhatsApp" required>
      </div>
      <div class="ember-line">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <button type="submit" class="phoenix-btn small" id="sendResetBtn">KIRIM</button>
      <div class="phoenix-extras center" style="margin-top: 20px;">
        <a href="index.html" class="back-to-login"><i class="fas fa-arrow-left"></i> Kembali ke Login</a>
      </div>
    </form>
  </div>

  <!-- JavaScript Khusus Lupa Password -->
  <script src="https://phoenix-taekwondo-family.vercel.app/JS/forgot-password.js"></script>
</body>
</html>
