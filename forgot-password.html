<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - PHOENIX TAEKWONDO FAMILY</title>
  <link rel="stylesheet" href="/CSS/style.css">
  <link rel="icon" type="image/svg+xml" href="/Foto/PHOENIX%20TAEKWONDO%20FAMILY.svg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="screenshotOverlay" class="screenshot-overlay">...</div>
  <div id="notification" class="notification">...</div>
  <div class="iphone-blocker" id="iphoneBlocker">...</div>
  <canvas id="phoenixCanvas"></canvas>
  <div class="dark-overlay"></div>
  <div id="emberContainer"></div>

  <div class="phoenix-wrapper">
    <div class="phoenix-header">
      <div class="welcome-image-container">
        <img class="welcome-image" src="/Foto/SELAMAT%20DATANG.svg" alt="Selamat Datang">
      </div>
      <div class="logo-container">
        <div class="circle-logo-wrapper">
          <div class="circle-logo">
            <img src="/Foto/PHOENIX%20TAEKWONDO%20FAMILY.svg" alt="Logo">
          </div>
        </div>
      </div>
      <div class="page-title">
        <i class="fas fa-fire"></i> LUPA PASSWORD <i class="fas fa-fire"></i>
      </div>
    </div>

    <form id="forgotPasswordForm">
      <div class="input-group">
        <i class="fas fa-envelope"></i>
        <input type="email" id="resetEmail" placeholder="Masukkan EMAIL" required>
      </div>
      <div class="input-group">
        <i class="fab fa-whatsapp"></i>
        <input type="tel" id="resetPhone" placeholder="Masukkan Nomor WhatsApp" required>
      </div>
      <div class="ember-line">...</div>
      <button type="submit" class="phoenix-btn small" id="sendResetBtn">KIRIM</button>
      <div class="phoenix-extras center">
        <a href="/" class="back-to-login"><i class="fas fa-arrow-left"></i> Kembali ke Login</a>
      </div>
    </form>
  </div>

  <script src="/JS/forgot-password.js"></script>
</body>
</html>
